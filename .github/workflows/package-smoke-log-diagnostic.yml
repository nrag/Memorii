name: Stop Superseded PR Validation

on:
  push:
    branches: [codex/inspect-package-smoke-log]

permissions:
  actions: write

jobs:
  stop:
    name: Stop the superseded blocked PR run
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the superseded candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=45687065202
          head=$(gh api "repos/nrag/Memorii/actions/runs/$run" --jq .head_sha)
          test "$head" = 38c1ed980cb4e221ac8b81c4841f8fc61639202c
          state=$(gh api "repos/nrag/Memorii/actions/runs/$run" --jq .status)
          if [ "$state" != completed ]; then
            gh api --method POST "repos/nrag/Memorii/actions/runs/$run/cancel"
            printf 'Cancellation requested for superseded run %s\n' "$run"
          else
            printf 'Superseded run %s already completed\n' "$run"
          fi
          gh api repos/nrag/Memorii/actions/workflows/canonical-evidence-parity-scheduled.yml \
            --jq '{id: .id, path: .path, state: .state}'
