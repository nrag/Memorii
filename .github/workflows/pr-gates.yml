name: PR Gates

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run Ruff
        working-directory: memorii
        run: ruff check memorii tests

      - name: Run Pyright
        working-directory: memorii
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

      - name: Run unit tests
        working-directory: memorii
        run: pytest tests/unit

  benchmark-contracts:
    name: Benchmark Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run benchmark contract tests
        working-directory: memorii
        run: >-
          pytest
          tests/unit/core/benchmark/test_memory_evolution_public_contracts.py
          tests/unit/core/benchmark/test_memory_evolution_oracle.py
          tests/unit/core/benchmark/test_memory_evolution_runtime_alignment.py
          tests/unit/core/benchmark/test_memory_evolution_runtime_execution_state.py
          tests/unit/core/test_memory_evolution_temporal.py
          tests/unit/core/test_memory_evolution_execution.py
          tests/unit/core/test_memory_evolution_retrieval.py
          tests/unit/core/test_calibration_gates.py
          tests/unit/core/test_calibration.py
          tests/unit/tools/test_validate_benchmark_artifacts.py

      - name: Build deterministic simulator artifact
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_sim_v1
          --mode llm
          --dry-run
          --fail-on-benchmark-failure
          --storage-root .memorii
          --sim-profile long_horizon
          --sim-scenario-count 10
          --sim-min-events 25
          --sim-max-events 60
          --sim-noise-rate 0.35
          --seed 7

      - name: Build deterministic runtime artifact
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_runtime_v1
          --mode llm
          --dry-run
          --fail-on-benchmark-failure
          --storage-root .memorii
          --sim-profile long_horizon
          --sim-scenario-count 10
          --sim-min-events 25
          --sim-max-events 60
          --sim-noise-rate 0.35
          --seed 7

      - name: Build deterministic adversarial simulator artifact
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_sim_v1
          --mode llm
          --dry-run
          --fail-on-benchmark-failure
          --storage-root .memorii
          --sim-profile adversarial
          --sim-scenario-count 10
          --sim-noise-rate 0.35
          --seed 7

      - name: Build deterministic adversarial runtime artifact
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_runtime_v1
          --mode llm
          --dry-run
          --fail-on-benchmark-failure
          --storage-root .memorii
          --sim-profile adversarial
          --sim-scenario-count 10
          --sim-noise-rate 0.35
          --seed 7

      - name: Validate deterministic benchmark reports
        working-directory: memorii
        run: >-
          python -m memorii.tools.validate_benchmark_artifacts
          --root .memorii/benchmark_runs
          --suite memory_evolution_sim_v1
          &&
          python -m memorii.tools.validate_benchmark_artifacts
          --root .memorii/benchmark_runs
          --suite memory_evolution_runtime_v1
