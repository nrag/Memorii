name: PR Gates

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  ctv-binding-authority-compiler-parity:
    name: CTV Binding Authority Compiler Parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compiler parity dependencies
        run: python3.12 -m pip install 'pytest>=8,<10'

      - name: Run independent CTV compiler parity
        working-directory: memorii
        run: >-
          python3.12 -m pytest -W error
          tests/unit/tools/test_semantic_ingestion_ctv_reference_compiler.py
          -p no:cacheprovider

  ctv-binding-authority-pr-gate:
    name: CTV Binding Authority PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PR-gate test dependencies
        run: python3.12 -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'

      - name: Run CTV PR-gate tamper tests
        working-directory: memorii
        run: >-
          python3.12 -m pytest -W error
          tests/unit/tools/test_ctv_binding_authority_pr_gate.py
          -p no:cacheprovider

  ctv-binding-authority-exact:
    name: CTV Binding Authority Exact
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This is intentionally dependency-free: the hermetic checker admits
      # only the frozen design, registry, authority, validator, and stdlib.
      - name: Verify pinned CTV binding authority
        run: >-
          python3.12 -I docs/design/semantic_ingestion/traceability_golden_vectors/check_ctv_binding_authority_v2.py
          --design docs/design/semantic_ingestion_architecture.md
          --registry docs/design/semantic_ingestion/traceability_registry/registry-v1.json
          --authority docs/design/semantic_ingestion/traceability_golden_vectors/ctv-binding-authority-v2.json
          --validator docs/design/semantic_ingestion/traceability_golden_vectors/validate_ctv_binding_authority_v2.py
          --expected-design-sha256 e7de038a5cad8f8d95536d60d35621472a79588e100c2da8633a9dd1fcfb5e7a
          --expected-registry-sha256 35396897f98833b3eeb9572b16d7eab38ea34741ca876a4a72048424de676ea3
          --expected-authority-sha256 0dff4f2c0c8a33b7a23ba067de07ae16e556d60b5f94192223b4c76a2246c056
          --expected-validator-sha256 826541e7864583bbe3c32e3f153c008f07a881f33d38861237dfac80d9f3657e
          --expected-checker-sha256 e2c35870a99e587f34cbffc701f42587520ee015009cd51647367da56716c732

      - name: Verify lifecycle-root signer provenance semantics
        run: >-
          python3.12 -I docs/design/semantic_ingestion/traceability_golden_vectors/check_lifecycle_root_signer_provenance_v1.py
          --design docs/design/semantic_ingestion_architecture.md
          --matrix docs/design/semantic_ingestion/traceability_golden_vectors/cgs_verification_attack_matrix-v1.json
          --fixture docs/design/semantic_ingestion/traceability_golden_vectors/lifecycle-root-signer-provenance-witness-v1.json
          --validator docs/design/semantic_ingestion/traceability_golden_vectors/validate_lifecycle_root_signer_provenance_v1.py
          --expected-checker-sha256 c4168249dbf4845d90e9593819323dc331e22e3bdfa5a9df70b076ed10449f01
          --self-test

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run Ruff
        working-directory: memorii
        run: ruff check memorii tests

      - name: Run Pyright
        working-directory: memorii
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Build and smoke-test wheel
        working-directory: memorii
        run: |
          python -m pip wheel . --no-deps --wheel-dir "${RUNNER_TEMP}/memorii-wheel"
          python -m pip install --no-deps --target "${RUNNER_TEMP}/memorii-wheel-site" "${RUNNER_TEMP}"/memorii-wheel/*.whl
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -c "from pathlib import Path; import memorii; root=Path('${RUNNER_TEMP}/memorii-wheel-site').resolve(); assert Path(memorii.__file__).resolve().is_relative_to(root); from memorii.core.memory_evolution.extraction_contracts import MemoryExtractionOutput; from memorii.core.prompts.runtime_manifest import PromptOwner; from memorii.core.prompts.registry import PromptRegistry; PromptRegistry().load('memory_extraction:v1', owner=PromptOwner.LLM_MEMORY_EXTRACTOR, output_model=MemoryExtractionOutput)"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -c "from pathlib import Path; import memorii.core.benchmark.memory_evolution_sim as sim, memorii.core.benchmark.memory_evolution_runtime as runtime, memorii.tools.run_benchmark as runner; root=Path('${RUNNER_TEMP}/memorii-wheel-site').resolve(); assert all(Path(module.__file__).resolve().is_relative_to(root) for module in (sim, runtime, runner))"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -c "from importlib.util import find_spec; removed=('memorii.core.promotion.models', 'memorii.core.promotion.legacy_models', 'memorii.core.promotion.lifecycle_models', 'memorii.core.prompts.manifest', 'memorii.core.prompts.schema_compatibility'); assert all(find_spec(module) is None for module in removed)"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -m memorii.tools.run_eval --suite memory_evolution_sim_v1 --mode llm --dry-run --storage-root "${RUNNER_TEMP}/memorii-wheel-benchmark" --sim-profile long_horizon --sim-scenario-count 1 --sim-min-events 5 --sim-max-events 10 --sim-noise-rate 0.35 --seed 7
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -m memorii.tools.validate_benchmark_artifacts --root "${RUNNER_TEMP}/memorii-wheel-benchmark/benchmark_runs" --suite memory_evolution_sim_v1

  unit-test-shards:
    name: Unit Test Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Verify complete deterministic shard plan
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards verify
          --config tests/ci/unit-shards.json

      - name: Run deterministic unit shard
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards run
          --config tests/ci/unit-shards.json
          --index ${{ matrix.shard }}
          --timing-output "${RUNNER_TEMP}/unit-shard-${{ matrix.shard }}-timings.json"

      - name: Upload shard timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-shard-${{ matrix.shard }}-timings
          path: ${{ runner.temp }}/unit-shard-${{ matrix.shard }}-timings.json
          if-no-files-found: error

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [static-analysis, package-smoke, unit-test-shards, unit-timing-inventory]

    steps:
      - name: Require every unit-test dependency
        env:
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
          TIMING_RESULT: ${{ needs.unit-timing-inventory.result }}
        run: >-
          test "$STATIC_RESULT" = success
          && test "$PACKAGE_RESULT" = success
          && test "$SHARD_RESULT" = success
          && test "$TIMING_RESULT" = success

  unit-timing-inventory:
    name: Unit Timing Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-test-shards]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Download shard timing evidence
        uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*-timings
          path: ${{ runner.temp }}/unit-shard-timings
          merge-multiple: true

      - name: Merge timing inventory
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards merge
          --config tests/ci/unit-shards.json
          --input-dir "${RUNNER_TEMP}/unit-shard-timings"
          --output "${RUNNER_TEMP}/unit-test-durations.json"

      - name: Upload complete timing inventory
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-timing-inventory
          path: ${{ runner.temp }}/unit-test-durations.json
          if-no-files-found: error

  semantic-ingestion-generation:
    name: Semantic Ingestion Generation Closure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run generation closure acceptance
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/tools/test_generation_closure_exactness.py
          -p no:cacheprovider

  semantic-ingestion-scenario:
    name: Semantic Ingestion Scenario Authority
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run scenario authority acceptance
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/tools/test_scenario_fixture_authority.py
          -p no:cacheprovider

  semantic-ingestion-acceptance:
    name: Semantic Ingestion Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run semantic ingestion public acceptance
        working-directory: memorii
        run: >-
          pytest -W error
          tests/acceptance/semantic_ingestion/test_sia_requirements.py
          -p no:cacheprovider

  benchmark-contract-tests:
    name: Benchmark Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run benchmark contract tests
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/core/benchmark/test_memory_evolution_public_contracts.py
          tests/unit/core/benchmark/test_memory_evolution_architecture.py
          tests/unit/core/benchmark/test_memory_evolution_oracle.py
          tests/unit/core/benchmark/test_memory_evolution_runtime_alignment.py
          tests/unit/core/benchmark/test_memory_evolution_runtime_execution_state.py
          tests/unit/core/benchmark/test_memory_evolution_sim_leakage_contracts.py
          tests/unit/core/benchmark/test_memory_evolution_sim_judge_contracts.py
          tests/unit/core/test_memory_evolution_temporal.py
          tests/unit/core/test_memory_evolution_execution.py
          tests/unit/core/test_memory_evolution_retrieval.py
          tests/unit/core/test_calibration_gates.py
          tests/unit/core/test_calibration.py
          tests/unit/tools/test_validate_benchmark_artifacts.py
          -p no:cacheprovider

      - name: Verify installable source fingerprint behavior
        working-directory: memorii
        run: >-
          pytest -W error
          tests/integration/test_benchmark_source_fingerprint.py
          -p no:cacheprovider

  benchmark-artifacts:
    name: Benchmark Artifact ${{ matrix.suite }} / ${{ matrix.profile }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: memory_evolution_sim_v1
            profile: long_horizon
            mode: llm
            count: 10
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_sim_v1
            profile: long_horizon
            mode: hybrid
            count: 10
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_sim_v1
            profile: adversarial
            mode: llm
            count: 10
            extra: ''
          - suite: memory_evolution_sim_v1
            profile: adversarial
            mode: hybrid
            count: 10
            extra: ''
          - suite: memory_evolution_runtime_v1
            profile: long_horizon
            mode: llm
            count: 10
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_runtime_v1
            profile: long_horizon
            mode: hybrid
            count: 25
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_runtime_v1
            profile: adversarial
            mode: llm
            count: 10
            extra: ''
          - suite: memory_evolution_runtime_v1
            profile: adversarial
            mode: hybrid
            count: 10
            extra: ''
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Build deterministic benchmark artifact
        working-directory: memorii
        env:
          BENCHMARK_SUITE: ${{ matrix.suite }}
          BENCHMARK_PROFILE: ${{ matrix.profile }}
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_COUNT: ${{ matrix.count }}
          BENCHMARK_EXTRA: ${{ matrix.extra }}
        run: |
          if [ "$BENCHMARK_SUITE" = memory_evolution_runtime_v1 ]; then
            runner=(python -m tests.support.run_memory_evolution_runtime_benchmark)
          else
            runner=(python -m memorii.tools.run_eval)
          fi
          "${runner[@]}" \
            --suite "$BENCHMARK_SUITE" \
            --mode "$BENCHMARK_MODE" \
            --dry-run \
            --fail-on-benchmark-failure \
            --storage-root .memorii \
            --sim-profile "$BENCHMARK_PROFILE" \
            --sim-scenario-count "$BENCHMARK_COUNT" \
            --sim-noise-rate 0.35 \
            --seed 7 \
            $BENCHMARK_EXTRA
          python -m memorii.tools.validate_benchmark_artifacts \
            --root .memorii/benchmark_runs \
            --suite "$BENCHMARK_SUITE"

  benchmark-contracts:
    name: Benchmark Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [benchmark-contract-tests, benchmark-artifacts]

    steps:
      - name: Require benchmark contract and artifact gates
        env:
          CONTRACT_RESULT: ${{ needs.benchmark-contract-tests.result }}
          ARTIFACT_RESULT: ${{ needs.benchmark-artifacts.result }}
        run: >-
          test "$CONTRACT_RESULT" = success
          && test "$ARTIFACT_RESULT" = success
