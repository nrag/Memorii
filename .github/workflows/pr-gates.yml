name: PR Gates

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run Ruff
        working-directory: memorii
        run: ruff check memorii tests

      - name: Run Pyright
        working-directory: memorii
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

      - name: Run unit tests
        working-directory: memorii
        run: pytest tests/unit
