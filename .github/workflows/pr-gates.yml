name: PR Gates

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  equal-version-replay-decision:
    name: Equal Version Replay Decision
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator test dependency
        run: python3.12 -m pip install 'pytest>=8,<10'

      - name: Verify frozen replay decision
        run: >-
          python3.12 -m pytest -W error
          memorii/tests/unit/tools/test_equal_version_replay_decision.py
          -p no:cacheprovider

  ctv-binding-authority-compiler-parity:
    name: CTV Binding Authority Compiler Parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install compiler parity dependencies
        run: python3.12 -m pip install 'pytest>=8,<10'

      - name: Run independent CTV compiler parity
        working-directory: memorii
        run: >-
          python3.12 -m pytest -W error
          tests/unit/tools/test_semantic_ingestion_ctv_reference_compiler.py
          -p no:cacheprovider

  ctv-binding-authority-pr-gate:
    name: CTV Binding Authority PR Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PR-gate test dependencies
        run: python3.12 -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'

      - name: Run CTV PR-gate tamper tests
        working-directory: memorii
        run: >-
          python3.12 -m pytest -W error
          tests/unit/tools/test_ctv_binding_authority_pr_gate.py
          -p no:cacheprovider

  ctv-binding-authority-exact:
    name: CTV Binding Authority Exact
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # This is intentionally dependency-free: the hermetic checker admits
      # only the frozen design, registry, authority, validator, and stdlib.
      - name: Verify pinned CTV binding authority
        run: >-
          python3.12 -I docs/design/semantic_ingestion/traceability_golden_vectors/check_ctv_binding_authority_v2.py
          --design docs/design/semantic_ingestion_architecture.md
          --registry docs/design/semantic_ingestion/traceability_registry/registry-v1.json
          --authority docs/design/semantic_ingestion/traceability_golden_vectors/ctv-binding-authority-v2.json
          --validator docs/design/semantic_ingestion/traceability_golden_vectors/validate_ctv_binding_authority_v2.py
          --expected-design-sha256 786c9f22c33db76bb16518cfa6da57ae95084b126e36d6462d6cd122d75fa17e
          --expected-registry-sha256 8c5ad6e6260c793472ddbc2df8637230fbb5d5b28405b0b558ac4491c945d37e
          --expected-authority-sha256 44474c77b79c69c8c07084e1d8f8f06340afbc67b51fd550cf9d54e274ef9a60
          --expected-validator-sha256 317133f2e92ad8032968314b3f16ff1b08b031c93c0ebcd3bbd789a876de5d6d
          --expected-checker-sha256 e2c35870a99e587f34cbffc701f42587520ee015009cd51647367da56716c732

      - name: Verify lifecycle-root signer provenance semantics
        run: >-
          python3.12 -I docs/design/semantic_ingestion/traceability_golden_vectors/check_lifecycle_root_signer_provenance_v1.py
          --design docs/design/semantic_ingestion_architecture.md
          --matrix docs/design/semantic_ingestion/traceability_golden_vectors/cgs_verification_attack_matrix-v1.json
          --fixture docs/design/semantic_ingestion/traceability_golden_vectors/lifecycle-root-signer-provenance-witness-v1.json
          --validator docs/design/semantic_ingestion/traceability_golden_vectors/validate_lifecycle_root_signer_provenance_v1.py
          --expected-checker-sha256 357cbe6f67e78250e89c469aa7b5227b263d950613746fb70120189ab3a4a4e5
          --self-test

      - name: Verify structural manifest contract
        run: >-
          python3.12 -I docs/design/semantic_ingestion/traceability_golden_vectors/check_cgs_structural_contract_v1.py
          --design docs/design/semantic_ingestion_architecture.md
          --registry docs/design/semantic_ingestion/traceability_registry/registry-v1.json
          --ledger docs/design/semantic_ingestion/traceability_golden_vectors/structural_manifest_derivation_ledger-v1.json
          --matrix docs/design/semantic_ingestion/traceability_golden_vectors/cgs_verification_attack_matrix-v1.json
          --prototype docs/design/semantic_ingestion/traceability_golden_vectors/cgs_structural_manifest_prototype.py
          --vector docs/design/semantic_ingestion/traceability_golden_vectors/cgs-structural-manifest-prototype-v1.json
          --expected-checker-sha256 63994a750eeb4206453fe4d43c83b4afa6441cd7dd852e109b4e165be0fb4a23
          --self-test

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run Ruff
        working-directory: memorii
        run: ruff check memorii tests

      - name: Verify behavioral identity hygiene
        working-directory: memorii
        run: python -m memorii.tools.identity_hygiene --root .. --allowlist ../.agents/identity_hygiene_allowlist.json

      - name: Run Pyright
        working-directory: memorii
        run: pyright --pythonpath "$(python -c 'import sys; print(sys.executable)')"

  package-smoke:
    name: Package Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Build and smoke-test wheel
        working-directory: memorii
        run: |
          python -m pip wheel . --no-deps --wheel-dir "${RUNNER_TEMP}/memorii-wheel"
          python -m pip install --no-deps --target "${RUNNER_TEMP}/memorii-wheel-site" "${RUNNER_TEMP}"/memorii-wheel/*.whl
          cd "${RUNNER_TEMP}"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -c "from pathlib import Path; import memorii; root=Path('${RUNNER_TEMP}/memorii-wheel-site').resolve(); assert Path(memorii.__file__).resolve().is_relative_to(root); from memorii.core.memory_evolution.extraction_contracts import MemoryExtractionOutput; from memorii.core.prompts.runtime_manifest import PromptOwner; from memorii.core.prompts.registry import PromptRegistry; PromptRegistry().load('memory_extraction:v1', owner=PromptOwner.LLM_MEMORY_EXTRACTOR, output_model=MemoryExtractionOutput)"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -c "from pathlib import Path; import memorii.core.benchmark.memory_evolution_sim as sim, memorii.core.benchmark.memory_evolution_runtime as runtime, memorii.tools.run_benchmark as runner; root=Path('${RUNNER_TEMP}/memorii-wheel-site').resolve(); assert all(Path(module.__file__).resolve().is_relative_to(root) for module in (sim, runtime, runner))"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -c "from importlib.util import find_spec; removed=('memorii.core.promotion.models', 'memorii.core.promotion.legacy_models', 'memorii.core.promotion.lifecycle_models', 'memorii.core.prompts.manifest', 'memorii.core.prompts.schema_compatibility'); assert all(find_spec(module) is None for module in removed)"
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -m memorii.tools.run_eval --suite memory_evolution_sim_v1 --mode llm --dry-run --storage-root "${RUNNER_TEMP}/memorii-wheel-benchmark" --sim-profile long_horizon --sim-scenario-count 1 --sim-min-events 5 --sim-max-events 10 --sim-noise-rate 0.35 --seed 7
          PYTHONPATH="${RUNNER_TEMP}/memorii-wheel-site" python -m memorii.tools.validate_benchmark_artifacts --root "${RUNNER_TEMP}/memorii-wheel-benchmark/benchmark_runs" --suite memory_evolution_sim_v1

  unit-test-shards:
    name: Unit Test Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Verify complete deterministic shard plan
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards verify
          --config tests/ci/unit-shards.json

      - name: Run deterministic unit shard
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards run
          --config tests/ci/unit-shards.json
          --index ${{ matrix.shard }}
          --timing-output "${RUNNER_TEMP}/unit-shard-${{ matrix.shard }}-timings.json"

      - name: Upload shard timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-shard-${{ matrix.shard }}-timings
          path: ${{ runner.temp }}/unit-shard-${{ matrix.shard }}-timings.json
          if-no-files-found: error

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [equal-version-replay-decision, static-analysis, package-smoke, provider-compatibility, unit-test-shards, unit-timing-inventory, semantic-terminal-persistence, semantic-terminal-persistence-timing-inventory]

    steps:
      - name: Require every unit-test dependency
        env:
          REPLAY_DECISION_RESULT: ${{ needs.equal-version-replay-decision.result }}
          STATIC_RESULT: ${{ needs.static-analysis.result }}
          PACKAGE_RESULT: ${{ needs.package-smoke.result }}
          COMPATIBILITY_RESULT: ${{ needs.provider-compatibility.result }}
          SHARD_RESULT: ${{ needs.unit-test-shards.result }}
          TIMING_RESULT: ${{ needs.unit-timing-inventory.result }}
          TERMINAL_RESULT: ${{ needs.semantic-terminal-persistence.result }}
          TERMINAL_TIMING_RESULT: ${{ needs.semantic-terminal-persistence-timing-inventory.result }}
        run: >-
          test "$REPLAY_DECISION_RESULT" = success
          && test "$STATIC_RESULT" = success
          && test "$PACKAGE_RESULT" = success
          && test "$COMPATIBILITY_RESULT" = success
          && test "$SHARD_RESULT" = success
          && test "$TIMING_RESULT" = success
          && test "$TERMINAL_RESULT" = success
          && test "$TERMINAL_TIMING_RESULT" = success

  semantic-terminal-persistence:
    name: Semantic Terminal Persistence Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6]
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Verify exact terminal-persistence collection count
        working-directory: memorii
        run: |
          observed="$(pytest --collect-only -q \
            tests/unit/core/semantic_ingestion/test_semantic_terminal_persistence.py \
            -p no:cacheprovider | tail -1)"
          [[ "$observed" == "156 tests collected in "* ]]

      - name: Verify exact terminal-persistence shard plan
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards verify
          --config tests/ci/semantic-terminal-persistence-shards.json

      - name: Run exact terminal-persistence shard
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards run
          --config tests/ci/semantic-terminal-persistence-shards.json
          --index ${{ matrix.shard }}
          --timing-output "${RUNNER_TEMP}/semantic-terminal-persistence-${{ matrix.shard }}-timings.json"

      - name: Upload terminal-persistence timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-terminal-persistence-${{ matrix.shard }}-timings
          path: ${{ runner.temp }}/semantic-terminal-persistence-${{ matrix.shard }}-timings.json
          if-no-files-found: error

  semantic-terminal-persistence-timing-inventory:
    name: Semantic Terminal Persistence Timing Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [semantic-terminal-persistence]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Download terminal-persistence timing evidence
        uses: actions/download-artifact@v4
        with:
          pattern: semantic-terminal-persistence-*-timings
          path: ${{ runner.temp }}/semantic-terminal-persistence-timings
          merge-multiple: true

      - name: Merge terminal-persistence timing inventory
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards merge
          --config tests/ci/semantic-terminal-persistence-shards.json
          --input-dir "${RUNNER_TEMP}/semantic-terminal-persistence-timings"
          --output "${RUNNER_TEMP}/semantic-terminal-persistence-test-durations.json"

      - name: Upload complete terminal-persistence timing inventory
        uses: actions/upload-artifact@v4
        with:
          name: semantic-terminal-persistence-timing-inventory
          path: ${{ runner.temp }}/semantic-terminal-persistence-test-durations.json
          if-no-files-found: error

  unit-timing-inventory:
    name: Unit Timing Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-test-shards]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Download shard timing evidence
        uses: actions/download-artifact@v4
        with:
          pattern: unit-shard-*-timings
          path: ${{ runner.temp }}/unit-shard-timings
          merge-multiple: true

      - name: Merge timing inventory
        working-directory: memorii
        run: >-
          python -m memorii.tools.test_shards merge
          --config tests/ci/unit-shards.json
          --input-dir "${RUNNER_TEMP}/unit-shard-timings"
          --output "${RUNNER_TEMP}/unit-test-durations.json"

      - name: Upload complete timing inventory
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-timing-inventory
          path: ${{ runner.temp }}/unit-test-durations.json
          if-no-files-found: error

  provider-compatibility:
    name: Provider Compatibility Recapture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Fetch pinned provider compatibility baseline
        working-directory: memorii
        run: >-
          BASELINE_REVISION="$(python -c 'from tools.extract_provider_compatibility_fixture import BASELINE_REVISION; print(BASELINE_REVISION)')"
          && git fetch --no-tags --depth=1 origin "$BASELINE_REVISION"
          && git cat-file -e "$BASELINE_REVISION^{commit}"

      - name: Verify deterministic historical provider recapture
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/core/semantic_ingestion/test_provider_compatibility.py
          tests/integration/semantic_ingestion/test_provider_compatibility_recapture.py
          -p no:cacheprovider

  semantic-ingestion-generation:
    name: Semantic Ingestion Generation Closure
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run generation closure acceptance
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/tools/test_generation_closure_exactness.py
          -p no:cacheprovider

      - name: Verify exact semantic ingestion collection count
        working-directory: memorii
        run: |
          observed="$(pytest --collect-only -q \
            tests/integration/test_semantic_ingestion_pipeline.py \
            tests/integration/test_semantic_ingestion_process_safety.py \
            tests/integration/test_conflict_attention_persistence.py \
            tests/integration/test_semantic_ingestion_replay.py \
            -p no:cacheprovider | tail -n 1)"
          [[ "$observed" == "34 tests collected in "* ]]

      - name: Run exact semantic ingestion integration and process closure
        working-directory: memorii
        run: >-
          pytest -W error
          tests/integration/test_semantic_ingestion_pipeline.py
          tests/integration/test_semantic_ingestion_process_safety.py
          tests/integration/test_conflict_attention_persistence.py
          tests/integration/test_semantic_ingestion_replay.py
          -p no:cacheprovider

  semantic-projection-history:
    name: Semantic Projection History
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Verify exact projection-history collection count
        working-directory: memorii
        run: |
          observed="$(pytest --collect-only -q \
            tests/unit/core/test_projection_history.py \
            tests/unit/core/semantic_ingestion/test_projection_scheduler.py \
            tests/unit/core/semantic_ingestion/test_policy_migration.py \
            tests/unit/core/semantic_ingestion/test_identity_lineage.py \
            tests/unit/core/semantic_ingestion/test_graph_planning.py \
            tests/unit/core/semantic_ingestion/test_identity_lineage_prerequisites.py \
            -p no:cacheprovider | tail -n 1)"
          [[ "$observed" == "84 tests collected in "* ]]

      - name: Run exact projection-history closure
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/core/test_projection_history.py
          tests/unit/core/semantic_ingestion/test_projection_scheduler.py
          tests/unit/core/semantic_ingestion/test_policy_migration.py
          tests/unit/core/semantic_ingestion/test_identity_lineage.py
          tests/unit/core/semantic_ingestion/test_graph_planning.py
          tests/unit/core/semantic_ingestion/test_identity_lineage_prerequisites.py
          -p no:cacheprovider

  semantic-ingestion-scenario:
    name: Semantic Ingestion Scenario Authority
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run scenario authority acceptance
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/tools/test_scenario_fixture_authority.py
          -p no:cacheprovider

  semantic-ingestion-acceptance:
    name: Semantic Ingestion Acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run semantic ingestion public acceptance
        working-directory: memorii
        run: >-
          pytest -W error
          tests/acceptance/semantic_ingestion/test_sia_requirements.py
          -p no:cacheprovider

  bootstrap-graph-transaction-boundary:
    name: Bootstrap Graph Transaction Boundary (${{ matrix.backend }}, ${{ matrix.root }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        root: [direct, factory, filesystem, hermes]
        backend: [memory, jsonl_independent_process]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Validate exact 352-tuple selector manifest
        working-directory: memorii
        run: >-
          python -m memorii.tools.bootstrap_graph_transaction_selector
          tests/ci/bootstrap-graph-transaction-boundary.json
          && pytest -W error
          tests/unit/tools/test_bootstrap_graph_transaction_selector.py
          -p no:cacheprovider

      - name: Run exact manifest-owned graph transaction shard
        working-directory: memorii
        run: >-
          python -m memorii.tools.bootstrap_graph_transaction_selector
          tests/ci/bootstrap-graph-transaction-boundary.json
          --run-shard
          --root ${{ matrix.root }}
          --backend ${{ matrix.backend }}
          --receipt bootstrap-graph-receipts/${{ matrix.root }}-${{ matrix.backend }}.json

      - name: Upload graph transaction timing receipt
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-graph-receipt-${{ matrix.root }}-${{ matrix.backend }}
          path: memorii/bootstrap-graph-receipts/*.json
          if-no-files-found: error

  bootstrap-graph-transaction-boundary-aggregate:
    name: Bootstrap Graph Transaction Boundary Aggregate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [bootstrap-graph-transaction-boundary]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package
        working-directory: memorii
        run: pip install -e .

      - name: Download all graph transaction receipts
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-graph-receipt-*
          path: memorii/bootstrap-graph-receipts
          merge-multiple: true

      - name: Validate exact receipt union and budgets
        working-directory: memorii
        run: >-
          python -m memorii.tools.bootstrap_graph_transaction_selector
          tests/ci/bootstrap-graph-transaction-boundary.json
          --validate-receipts bootstrap-graph-receipts

  semantic-ingestion:
    name: Semantic Ingestion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [semantic-ingestion-generation, semantic-ingestion-scenario, semantic-ingestion-acceptance, semantic-projection-history, bootstrap-graph-transaction-boundary-aggregate]

    steps:
      - name: Require every semantic-ingestion dependency
        env:
          GENERATION_RESULT: ${{ needs.semantic-ingestion-generation.result }}
          SCENARIO_RESULT: ${{ needs.semantic-ingestion-scenario.result }}
          ACCEPTANCE_RESULT: ${{ needs.semantic-ingestion-acceptance.result }}
          PROJECTION_HISTORY_RESULT: ${{ needs.semantic-projection-history.result }}
          BOOTSTRAP_GRAPH_RESULT: ${{ needs.bootstrap-graph-transaction-boundary-aggregate.result }}
        run: >-
          test "$GENERATION_RESULT" = success
          && test "$SCENARIO_RESULT" = success
          && test "$ACCEPTANCE_RESULT" = success
          && test "$PROJECTION_HISTORY_RESULT" = success
          && test "$BOOTSTRAP_GRAPH_RESULT" = success

  benchmark-contract-tests:
    name: Benchmark Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run benchmark contract tests
        working-directory: memorii
        run: >-
          pytest -W error
          tests/unit/core/benchmark/test_memory_evolution_public_contracts.py
          tests/unit/core/benchmark/test_memory_evolution_architecture.py
          tests/unit/core/benchmark/test_memory_evolution_oracle.py
          tests/unit/core/benchmark/test_memory_evolution_runtime_alignment.py
          tests/unit/core/benchmark/test_memory_evolution_runtime_execution_state.py
          tests/unit/core/benchmark/test_memory_evolution_sim_leakage_contracts.py
          tests/unit/core/benchmark/test_memory_evolution_sim_judge_contracts.py
          tests/unit/core/test_memory_evolution_temporal.py
          tests/unit/core/test_memory_evolution_execution.py
          tests/unit/core/test_memory_evolution_retrieval.py
          tests/unit/core/test_calibration_gates.py
          tests/unit/core/test_calibration.py
          tests/unit/tools/test_validate_benchmark_artifacts.py
          -p no:cacheprovider

      - name: Verify installable source fingerprint behavior
        working-directory: memorii
        run: >-
          pytest -W error
          tests/integration/test_benchmark_source_fingerprint.py
          -p no:cacheprovider

  benchmark-artifacts:
    name: Benchmark Artifact ${{ matrix.suite }} / ${{ matrix.profile }} / ${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: memory_evolution_sim_v1
            profile: long_horizon
            mode: llm
            count: 10
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_sim_v1
            profile: long_horizon
            mode: hybrid
            count: 10
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_sim_v1
            profile: adversarial
            mode: llm
            count: 10
            extra: ''
          - suite: memory_evolution_sim_v1
            profile: adversarial
            mode: hybrid
            count: 10
            extra: ''
          - suite: memory_evolution_runtime_v1
            profile: long_horizon
            mode: llm
            count: 10
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_runtime_v1
            profile: long_horizon
            mode: hybrid
            count: 25
            extra: --sim-min-events 25 --sim-max-events 60
          - suite: memory_evolution_runtime_v1
            profile: adversarial
            mode: llm
            count: 10
            extra: ''
          - suite: memory_evolution_runtime_v1
            profile: adversarial
            mode: hybrid
            count: 10
            extra: ''
    env:
      MEMORII_SOURCE_REVISION: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Build deterministic benchmark artifact
        working-directory: memorii
        env:
          BENCHMARK_SUITE: ${{ matrix.suite }}
          BENCHMARK_PROFILE: ${{ matrix.profile }}
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_COUNT: ${{ matrix.count }}
          BENCHMARK_EXTRA: ${{ matrix.extra }}
        run: |
          if [ "$BENCHMARK_SUITE" = memory_evolution_runtime_v1 ]; then
            runner=(python -m tests.support.run_memory_evolution_runtime_benchmark)
          else
            runner=(python -m memorii.tools.run_eval)
          fi
          "${runner[@]}" \
            --suite "$BENCHMARK_SUITE" \
            --mode "$BENCHMARK_MODE" \
            --dry-run \
            --fail-on-benchmark-failure \
            --storage-root .memorii \
            --sim-profile "$BENCHMARK_PROFILE" \
            --sim-scenario-count "$BENCHMARK_COUNT" \
            --sim-noise-rate 0.35 \
            --seed 7 \
            $BENCHMARK_EXTRA
          python -m memorii.tools.validate_benchmark_artifacts \
            --root .memorii/benchmark_runs \
            --suite "$BENCHMARK_SUITE"

  benchmark-contracts:
    name: Benchmark Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [benchmark-contract-tests, benchmark-artifacts]

    steps:
      - name: Require benchmark contract and artifact gates
        env:
          CONTRACT_RESULT: ${{ needs.benchmark-contract-tests.result }}
          ARTIFACT_RESULT: ${{ needs.benchmark-artifacts.result }}
        run: >-
          test "$CONTRACT_RESULT" = success
          && test "$ARTIFACT_RESULT" = success
