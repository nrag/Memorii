name: Scheduled Canonical-Evidence Mode Parity

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/canonical-evidence-parity-scheduled.yml
      - memorii/pyproject.toml
      - memorii/tests/unit/core/test_provider_service.py
      - memorii/tests/unit/core/semantic_ingestion/test_bootstrap_graph_coordinator_v3.py
      - memorii/tests/unit/core/semantic_ingestion/test_canonical_evidence_mode_parity.py
      - memorii/tests/unit/core/semantic_ingestion/test_canonical_evidence_production_limits.py
      - memorii/tests/integration/test_observation_ledger_activation.py

permissions:
  contents: read

concurrency:
  group: canonical-evidence-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-evidence:
    name: Canonical-Evidence Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            memorii/pyproject.toml
            .github/workflows/canonical-evidence-parity-scheduled.yml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[dev]'

      - name: Verify exact mode-parity collection count
        working-directory: memorii
        run: |
          observed="$(pytest --collect-only -q \
            tests/unit/core/semantic_ingestion/test_canonical_evidence_mode_parity.py \
            -p no:cacheprovider | tail -1)"
          [[ "$observed" == "2 tests collected in "* ]]

      - name: Run diametric mode-parity proofs
        working-directory: memorii
        run: >-
          python -W error -m pytest
          tests/unit/core/semantic_ingestion/test_canonical_evidence_mode_parity.py
          -p no:cacheprovider

      - name: Verify exact admission-limits collection count
        if: success() || failure()
        working-directory: memorii
        run: |
          observed="$(pytest --collect-only -q \
            tests/unit/core/semantic_ingestion/test_canonical_evidence_production_limits.py \
            -p no:cacheprovider | tail -1)"
          [[ "$observed" == "3 tests collected in "* ]]

      - name: Run production-root admission-boundary proofs
        if: success() || failure()
        working-directory: memorii
        run: >-
          python -W error -m pytest
          tests/unit/core/semantic_ingestion/test_canonical_evidence_production_limits.py
          -p no:cacheprovider
