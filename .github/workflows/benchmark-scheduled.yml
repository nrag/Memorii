name: Scheduled Benchmark Reports

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmark-certification-${{ github.sha }}
  cancel-in-progress: false

env:
  MEMORII_SOURCE_REVISION: ${{ github.sha }}

jobs:
  fake-oracle-plumbing:
    name: Fake-Oracle Plumbing Reports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MEMORII_SOURCE_REVISION }}

      - name: Verify exact clean source revision
        run: |
          test "$(git rev-parse HEAD)" = "$MEMORII_SOURCE_REVISION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Build fake-oracle simulator plumbing artifact
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_sim_v1
          --mode llm
          --dry-run
          --fail-on-benchmark-failure
          --storage-root .memorii
          --sim-profile long_horizon
          --sim-scenario-count 10
          --sim-min-events 25
          --sim-max-events 60
          --sim-noise-rate 0.35
          --seed 7

      - name: Build fake-oracle runtime plumbing artifact
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_runtime_v1
          --mode llm
          --dry-run
          --storage-root .memorii
          --sim-profile long_horizon
          --sim-scenario-count 10
          --sim-min-events 25
          --sim-max-events 60
          --sim-noise-rate 0.35
          --seed 7

      - name: Validate fake-oracle plumbing artifacts
        working-directory: memorii
        run: >-
          python -m memorii.tools.validate_benchmark_artifacts
          --root .memorii/benchmark_runs
          --suite memory_evolution_sim_v1
          &&
          python -m memorii.tools.validate_benchmark_artifacts
          --root .memorii/benchmark_runs
          --suite memory_evolution_runtime_v1

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fake-oracle-plumbing-reports
          path: memorii/.memorii/benchmark_runs
          if-no-files-found: warn

  live-runtime-smoke:
    name: Live Runtime Smoke (seed ${{ matrix.seed }}, replicate ${{ matrix.replicate }})
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.MEMORII_RUN_LIVE_GATES == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        seed: [7, 11, 19, 23, 31, 37, 41, 43, 47, 53]
        replicate: [0, 1]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MEMORII_LLM_MAX_RETRIES: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MEMORII_SOURCE_REVISION }}

      - name: Verify exact clean source revision
        run: |
          test "$(git rev-parse HEAD)" = "$MEMORII_SOURCE_REVISION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Run live runtime smoke
        working-directory: memorii
        run: >-
          python -m memorii.tools.run_eval
          --suite memory_evolution_runtime_v1
          --mode hybrid
          --allow-live
          --defer-live-gate
          --storage-root .memorii
          --sim-profile long_horizon
          --sim-scenario-count 25
          --sim-min-events 25
          --sim-max-events 60
          --sim-noise-rate 0.35
          --seed ${{ matrix.seed }}
          --inference-replicate ${{ matrix.replicate }}

      - name: Upload live artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-runtime-smoke-reports-${{ matrix.seed }}-${{ matrix.replicate }}
          path: memorii/.memorii/benchmark_runs
          if-no-files-found: warn

  live-runtime-gate:
    name: Live Runtime Statistical Gate
    needs: live-runtime-smoke
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.MEMORII_RUN_LIVE_GATES == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.MEMORII_SOURCE_REVISION }}

      - name: Verify exact clean source revision
        run: |
          test "$(git rev-parse HEAD)" = "$MEMORII_SOURCE_REVISION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: memorii/pyproject.toml

      - name: Install package + test deps
        working-directory: memorii
        run: pip install -e '.[local,dev]'

      - name: Download live reports
        uses: actions/download-artifact@v4
        with:
          pattern: live-runtime-smoke-reports-*
          path: memorii/.memorii/benchmark_runs
          merge-multiple: true

      - name: Evaluate live statistical gate
        working-directory: memorii
        run: >-
          python -m memorii.tools.validate_live_benchmark_gate
          --root .memorii/benchmark_runs
          --suite memory_evolution_runtime_v1
          --mode hybrid
          --profile long_horizon
          --minimum-seed-count 10
          --minimum-scenarios-per-replicate 25
          --minimum-replicates-per-seed 2
          --minimum-pass-rate-lower-bound 0.90
          --minimum-family-pass-rate-lower-bound 0.75
          --minimum-family-scenarios-per-seed 2
          --minimum-seed-pass-rate 0.80
          --confidence-level 0.95
          --design-target-scenario-reliability 0.98
          --minimum-design-power 0.80
          --maximum-null-acceptance-probability 0.05
          --minimum-interval-coverage 0.90
          --design-trials 500
          --intraseed-correlation 0.05
          --source-revision "$MEMORII_SOURCE_REVISION"
          --maximum-provider-failure-rate 0.05
          --maximum-fallback-rate 0.05
          --output .memorii/benchmark_runs/live_runtime_gate_summary.json

      - name: Verify source-bound gate certificate
        working-directory: memorii
        run: >-
          python -c
          "import json, os; from pathlib import Path; from memorii.core.benchmark.calibration.gates import LiveGateSummary; summary=LiveGateSummary.model_validate(json.loads(Path('.memorii/benchmark_runs/live_runtime_gate_summary.json').read_text())); assert summary.passed; assert summary.source_revision == os.environ['MEMORII_SOURCE_REVISION']; assert summary.interval_coverage_certificate is not None; assert summary.interval_coverage_certificate.configuration.source_revision == os.environ['MEMORII_SOURCE_REVISION']"

      - name: Upload live gate summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-runtime-gate-summary
          path: memorii/.memorii/benchmark_runs/live_runtime_gate_summary.json
          if-no-files-found: warn
