[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorii"
version = "0.1.0"
description = "Memorii framework-neutral memory plane"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyICU>=2.13",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6.0,<7",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
local = [
  "openai>=1.0",
  "pytest>=8.0",
]
live = [
  "openai>=1.0",
  "pytest>=8.0",
]
dev = [
  "numpy>=1.26,<3",
  "openai>=1.0",
  "pytest>=8.0",
  "ruff>=0.8,<1",
  "scipy>=1.13,<2",
  "pyright>=1.1,<2",
]
prod = [
  "openai>=1.0",
  "azure-identity>=1.16",
  "azure-keyvault-secrets>=4.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
memorii = ["core/benchmark/fixture_sets/*.json", "prompts/**/*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["memorii*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: tests that cross component boundaries and may require an explicitly enabled external provider",
]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["memorii", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # keep line-length advisory during the warning-first rollout
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
"tests/fixtures/semantic_ingestion/provider_compatibility/*.baseline.py" = ["I001"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
  "memorii/core/belief",
  "memorii/core/benchmark/artifact_rows",
  "memorii/core/benchmark/artifact_validation.py",
  "memorii/core/benchmark/reproducibility.py",
  "memorii/core/memory_evolution",
  "memorii/core/memory_plane",
  "memorii/core/provider",
  "memorii/core/promotion",
  "memorii/core/benchmark/memory_evolution_sim",
  "memorii/core/benchmark/memory_evolution_runtime",
  "memorii/core/benchmark/calibration",
  "memorii/core/prompts",
  "memorii/core/llm_decision",
  "memorii/integrations",
  "memorii/tools/benchmark_suites",
]
exclude = [
  "**/__pycache__",
]
reportMissingTypeStubs = false
reportArgumentType = "error"
reportAssignmentType = "error"
reportAttributeAccessIssue = "error"
reportCallIssue = "error"
reportGeneralTypeIssues = "error"
reportOperatorIssue = "error"
reportOptionalMemberAccess = "error"
reportReturnType = "error"
