[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorii"
version = "0.1.0"
description = "Memorii framework-neutral memory plane"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "PyICU>=2.13",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6.0,<7",
  "jsonschema>=4,<5",
]

[project.optional-dependencies]
local = [
  "openai>=1.0",
  "pytest>=8.0",
]
live = [
  "openai>=1.0",
  "pytest>=8.0",
]
prod = [
  "openai>=1.0",
  "azure-identity>=1.16",
  "azure-keyvault-secrets>=4.8",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["memorii*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["memorii", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # keep line-length advisory during the warning-first rollout
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
  "memorii/core/memory_evolution",
  "memorii/core/benchmark/memory_evolution_sim",
  "memorii/core/benchmark/memory_evolution_runtime",
  "memorii/core/calibration",
  "memorii/core/prompts",
]
exclude = [
  "**/__pycache__",
]
reportMissingTypeStubs = false
