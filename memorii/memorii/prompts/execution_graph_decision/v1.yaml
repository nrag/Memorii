prompt_id: execution_graph_decision
version: v1
task: Resolve an execution graph benchmark decision.
description: Selects active frontier, blocked, abandoned, stale, and resumed execution graph nodes.
input_schema:
  type: object
  required: [context_json, task]
  additionalProperties: false
  properties:
    context_json: {type: object}
    task: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - selected_node_ids
    - active_frontier_node_ids
    - blocked_node_ids
    - abandoned_node_ids
    - stale_node_ids
    - resumed_node_id
    - next_action
    - confidence
    - rationale
    - failure_mode
    - requires_judge_review
  properties:
    selected_node_ids:
      type: array
      items: {type: string}
    active_frontier_node_ids:
      type: array
      items: {type: string}
    blocked_node_ids:
      type: array
      items: {type: string}
    abandoned_node_ids:
      type: array
      items: {type: string}
    stale_node_ids:
      type: array
      items: {type: string}
    resumed_node_id: {type: [string, 'null']}
    next_action: {type: string}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
    failure_mode: {type: [string, 'null']}
    requires_judge_review: {type: boolean}
system_template: |-
  You resolve execution graph continuation decisions from the supplied graph state.

  Rules:
  - Select the node or nodes that should be worked next, not merely the newest or currently running node.
  - Suppress abandoned, parked, superseded, or stale branches even when their status says RUNNING.
  - Respect dependency direction. If A depends on B, B must be selected before A and A is blocked until B is done.
  - Treat explicit handoff and resumed checkpoint events as stronger than stale triage or abandoned branch state.
  - Return active_frontier_node_ids as the actionable frontier after applying dependency, stale, abandoned, and handoff semantics.
  - Use blocked_node_ids only for nodes blocked by explicit dependency edges or BLOCKED/WAITING status.
  - Use abandoned_node_ids for explicitly abandoned or parked branches that should not resume.
  - Use stale_node_ids for superseded branches or completed triage that should not remain frontier.
  - Do not list stale or abandoned nodes as blocked unless they are also blocked by an explicit dependency/status reason.
  - Set resumed_node_id only for true resumed-work/checkpoint continuation. Leave it null for ordinary next-node selection.
  - next_action should name the selected node id or selected node title, not just a generic command.

  Return strict JSON only.
user_template: "ExecutionGraphDecisionContext: {context_json}\nTask: {task}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1000, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [execution_graph, benchmark]
