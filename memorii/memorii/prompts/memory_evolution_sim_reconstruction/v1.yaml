prompt_id: memory_evolution_sim_reconstruction
version: v1
task: Make the semantic decision for a visible memory graph checkpoint.
description: Classifies every visible claim; deterministic code compiles graph channels and closure.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - operation
    - claim_assessments
    - answer
    - next_action
    - uncertain_ids
    - confidence
    - rationale
  properties:
    operation: {type: string, enum: [answer, next_action, graph_reconstruction, abstain]}
    claim_assessments:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [claim_id, role, belief_rank]
        properties:
          claim_id: {type: string}
          role: {type: string, enum: [primary, relevant, irrelevant]}
          belief_rank:
            anyOf:
              - {type: integer, minimum: 1}
              - {type: 'null'}
    answer: {type: [string, 'null']}
    next_action: {type: [string, 'null']}
    uncertain_ids: {type: array, items: {type: string}}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
system_template: |-
  Make only the semantic choices needed to answer the query from visible candidate cards.

  Follow checkpoint.task_contract for operation and answer projection. Classify every visible
  claim exactly once. Use primary for answer-bearing truth or action claims, relevant for
  query-relevant alternatives and disambiguating claims, and irrelevant for visible noise.
  Do not emit entity, relation, support, citation, rejection, or context channels. Deterministic
  compilation derives those channels from visible endpoints, evidence, lifecycle, assessments,
  and the public task contract.

  Semantic rules:
  - Use only IDs in the visible candidate lists.
  - Emit exactly one claim_assessments item for every visible claim ID, without duplicates.
  - For current truth, mark the trusted active answer claim primary and conflicting stale alternatives relevant.
  - For historical truth, mark the claim valid in the requested interval primary.
  - Keep same-name entities distinct by ID and endpoint role.
  - A primary ownership claim answers with its object value or object entity; its subject entity remains graph-selected.
  - Mark definitions and wrong-entity alternatives relevant when they disambiguate the query.
  - Deterministic code adds mechanically required definitions, lifecycle competitors, relations, and evidence.
  - When belief_ranking_policy is required, assign unique contiguous belief_rank values beginning at 1
    to the ranked relevant belief claims. Otherwise belief_rank must be null for every assessment.
  - For operation=next_action, mark only the latest eligible active action-state branch primary. Ownership
    and command context are not action state; blocked, abandoned, completed, and superseded branches
    are not selectable.
  - If evidence does not determine a unique result, abstain or identify uncertain visible IDs.

  If context_json.repair_request is present, revise only fields implicated by its violation_codes.
  This is the sole repair attempt.

  Return strict JSON only.
user_template: "MemoryEvolutionSimReconstructionContext: {context_json}\nQueryOrTask: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 700, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [memory_evolution_sim, benchmark, semantic_decision]
