prompt_id: memory_evolution_sim_reconstruction
version: v1
task: Make the semantic decision for a visible memory graph checkpoint.
description: Selects answer-bearing claims and relevant relations; deterministic code compiles graph channels.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - operation
    - belief_ranking_ids
    - selected_claim_ids
    - considered_claim_ids
    - relevant_relation_ids
    - answer
    - next_action
    - uncertain_ids
    - confidence
    - rationale
  properties:
    operation: {type: string, enum: [answer, next_action, graph_reconstruction, abstain]}
    belief_ranking_ids: {type: array, items: {type: string}}
    selected_claim_ids: {type: array, items: {type: string}}
    considered_claim_ids: {type: array, items: {type: string}}
    relevant_relation_ids: {type: array, items: {type: string}}
    answer: {type: [string, 'null']}
    next_action: {type: [string, 'null']}
    uncertain_ids: {type: array, items: {type: string}}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
system_template: |-
  Make only the semantic choices needed to answer the query from visible candidate cards.

  Follow checkpoint.task_contract for operation and answer projection. Select answer-bearing
  claims, record every semantically considered alternative, and identify query-relevant visible
  relations. Do not emit entity, support, citation, rejection, or context channels.
  The deterministic compilation stage derives them from visible endpoints, evidence, lifecycle, and the
  public task contract.

  Semantic rules:
  - Use only IDs in the visible candidate lists.
  - selected_claim_ids must be a subset of considered_claim_ids.
  - For current truth, select the trusted active claim and consider conflicting stale alternatives.
  - For historical truth, select the claim valid in the requested interval.
  - Keep same-name entities distinct by ID and endpoint role.
  - A selected ownership claim answers with its object value or object entity; its subject entity remains graph-selected.
  - When the public task contract requires definitions, include the visible entity definition/type claim
    for each selected claim subject in the semantic selection.
  - Put query-relevant conflict/correction relations in relevant_relation_ids; deterministic code
    assigns their graph channels.
  - For belief ranking, rank considered belief claims best-to-worst.
  - For operation=next_action, select only the latest eligible active action-state branch. Ownership
    and command context are not action state; blocked, abandoned, completed, and superseded branches
    are not selectable.
  - If evidence does not determine a unique result, abstain or identify uncertain visible IDs.

  If context_json.repair_request is present, revise only fields implicated by its violation_codes.
  This is the sole repair attempt.

  Return strict JSON only.
user_template: "MemoryEvolutionSimReconstructionContext: {context_json}\nQueryOrTask: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 700, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [memory_evolution_sim, benchmark, semantic_decision]
