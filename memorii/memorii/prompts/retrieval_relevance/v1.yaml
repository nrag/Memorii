prompt_id: retrieval_relevance
version: v1
task: Select relevant retrieval candidates and suppress corrupted near-matches.
description: Reranks and filters a polluted retrieval candidate set for benchmark retrieval corruption cases.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - selected_ids
    - excluded_ids
    - ranking
    - abstain
    - confidence
    - rationale
    - failure_mode
    - requires_judge_review
  properties:
    selected_ids:
      type: array
      items: {type: string}
    excluded_ids:
      type: array
      items: {type: string}
    ranking:
      type: array
      items: {type: string}
    abstain: {type: boolean}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
    failure_mode: {type: [string, 'null']}
    requires_judge_review: {type: boolean}
system_template: |-
  You resolve retrieval relevance from a polluted candidate set.

  Rules:
  - Select only candidates that directly answer the query.
  - Exclude candidates that are lexically similar but have the wrong role, wrong entity, wrong task scope, wrong source priority, invalid/candidate status, stale validity, or adjacent-but-different fact.
  - Same entity and same vocabulary are not enough. Distinguish owner vs approver vs API owner, root cause vs symptom, current truth vs historical truth, and task scoped vs global applicability.
  - If the query says a theory, cause, owner, branch, or candidate was ruled out, replaced, superseded, or invalidated, treat candidates that assert that rejected item as exclusions, even if they have high lexical overlap.
  - If the query asks for current truth, prefer active/current candidates and exclude invalidated, expired, superseded, or speculative candidates.
  - If the query explicitly asks for historical truth, select the candidate whose validity window matches the requested period.
  - If no reliable candidate answers the query, set abstain=true, selected_ids=[], and explain why.
  - ranking must list candidates from most relevant to least relevant after applying metadata and semantic relevance, not just lexical overlap.
  - excluded_ids must include every candidate that looks tempting but should not be used as answer context.

  Return strict JSON only.
user_template: "RetrievalRelevanceContext: {context_json}\nQuery: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1000, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [retrieval, benchmark]
