prompt_id: memory_evolution_decision
version: v1
task: Make the semantic decision for a memory evolution checkpoint.
description: Selects answer-bearing memories and belief states; deterministic code compiles lifecycle and retrieval channels.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - operation
    - answer
    - next_action
    - confidence
    - query_temporal_frame
    - selected_memory_ids
    - considered_memory_ids
    - belief_scores
    - rationale
    - requires_judge_review
  properties:
    operation: {type: string, enum: [answer, next_action, abstain]}
    answer: {type: [string, 'null']}
    next_action: {type: [string, 'null']}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    query_temporal_frame:
      type: object
      additionalProperties: false
      required: [temporal_reference, decision_domain, scope_kind, scope_key, anchor_id, valid_from, valid_to, confidence, rationale]
      properties:
        temporal_reference: {type: string, enum: [current, historical, interval, ambiguous]}
        decision_domain: {type: string, enum: [fact, belief, execution]}
        scope_kind: {type: string, enum: [none, global, task, entity, custom]}
        scope_key: {type: [string, 'null']}
        anchor_id: {type: [string, 'null']}
        valid_from:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        valid_to:
          anyOf: [{type: string, format: date-time}, {type: 'null'}]
        confidence: {type: number, minimum: 0.0, maximum: 1.0}
        rationale: {type: string}
    selected_memory_ids: {type: array, items: {type: string}}
    considered_memory_ids: {type: array, items: {type: string}}
    belief_scores:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [memory_id, belief, belief_state]
        properties:
          memory_id: {type: string}
          belief: {type: number, minimum: 0.0, maximum: 1.0}
          belief_state:
            type: string
            enum: [unknown, confident, degraded, falsified, superseded]
    rationale: {type: string}
    requires_judge_review: {type: boolean}
system_template: |-
  Make only the semantic choices needed for this benchmark checkpoint.

  The supplied decision_contract is authoritative for decision_domain, temporal_reference,
  operation type, and answer projection. Select answer-bearing memories, record every
  semantically considered alternative, and score visible beliefs when the contract asks for
  belief evaluation. Do not emit lifecycle, support, citation, context, rejection, entity, or
  relation channels; deterministic code derives those from visible cards and the public contract.

  Semantic rules:
  - Use only memory IDs present in visible_memory_cards.
  - selected_memory_ids must be a subset of considered_memory_ids.
  - Current fact queries select the trusted checkpoint-current state.
  - Historical queries select the state valid in the requested visible interval or anchor.
  - When decision_contract.belief_score_policy is none, belief_scores must be empty.
    For every other belief-score policy, emit the required visible belief evaluations.
  - Belief decisions distinguish content state from memory-record lifecycle. Falsified beliefs
    cannot be selected; include their scores and state when evaluated.
  - Execution decisions select only the active action-state memory. Command, ownership, blocked,
    abandoned, archived, and stale memories may be considered but cannot be selected.
  - If evidence is genuinely insufficient or ambiguous, abstain and set requires_judge_review.

  If context_json.repair_request is present, revise only the semantic fields implicated by its
  machine-readable violation_codes. It is the sole repair attempt.

  Return strict JSON only.
user_template: "MemoryEvolutionDecisionContext: {context_json}\nQueryOrTask: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 700, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [memory_evolution, benchmark, semantic_decision]
