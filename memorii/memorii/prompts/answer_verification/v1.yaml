prompt_id: answer_verification
version: v1
task: Verify that an answer is entailed by cited evidence.
description: Checks whether an answer is fully supported by the selected evidence and identifies the minimal sufficient provenance citations.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - entailed
    - corrected_answer
    - required_candidate_ids
    - missing_candidate_ids
    - question_constraints
    - alternative_answers
    - confidence
    - rationale
    - failure_mode
    - requires_judge_review
  properties:
    entailed: {type: boolean}
    corrected_answer: {type: [string, 'null']}
    required_candidate_ids:
      type: array
      items: {type: string}
    missing_candidate_ids:
      type: array
      items: {type: string}
    question_constraints:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [constraint_id, description, satisfied, candidate_ids, rationale]
        properties:
          constraint_id: {type: string}
          description: {type: string}
          satisfied: {type: boolean}
          candidate_ids:
            type: array
            items: {type: string}
          rationale: {type: string}
    alternative_answers:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [answer, candidate_ids, satisfies_question_constraints, better_than_proposed_answer, satisfied_requirement_ids, missing_requirement_ids, rationale]
        properties:
          answer: {type: string}
          candidate_ids:
            type: array
            items: {type: string}
          satisfies_question_constraints: {type: boolean}
          better_than_proposed_answer: {type: boolean}
          satisfied_requirement_ids:
            type: array
            items: {type: string}
          missing_requirement_ids:
            type: array
            items: {type: string}
          rationale: {type: string}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
    failure_mode: {type: [string, 'null']}
    requires_judge_review: {type: boolean}
system_template: |-
  You verify grounded answers.

  Rules:
  - Candidate IDs are short local IDs for this request only; copy them exactly from the provided evidence.
  - Use candidate text as factual evidence. Treat title, source_id, and metadata as locators or disambiguators, not as factual support by themselves.
  - entailed=true only when the answer is fully supported by the provided evidence.
  - Mark entailed=false if the answer is too broad, too narrow, uses the wrong entity, uses outside knowledge, contradicts evidence, or lacks a required supporting step.
  - Break the question into the required constraints that a correct answer must satisfy, including entity constraints, relation constraints, bridge constraints, comparison criteria, temporal constraints, and requested output type.
  - Use answer_requirements from the input context as the canonical requirement list when present.
  - question_constraints must list those constraints. For each constraint, set satisfied=true only when candidate text supports that specific constraint for the proposed answer.
  - A locally supported answer is not enough: entailed=true requires every required question constraint to be satisfied by candidate text.
  - If evidence supports the answer string but does not prove it satisfies all constraints in the question, set entailed=false and explain the uncovered constraint.
  - Actively look for plausible alternative answers in the selected evidence. List them in alternative_answers.
  - Use candidate_answers_considered from the input context as the first set of alternatives to adjudicate; do not rely only on open-ended discovery.
  - Compare the selected and non-selected candidate answers requirement-by-requirement.
  - If the selected candidate answer has missing_requirement_ids for any answer_requirements, mark entailed=false.
  - If a non-selected candidate satisfies strictly more answer_requirements than the selected answer, include it in alternative_answers with better_than_proposed_answer=true and mark entailed=false.
  - If candidate_answers_considered includes a non-selected answer that satisfies the constraints better than the proposed answer, include it in alternative_answers with better_than_proposed_answer=true and mark entailed=false.
  - If another answer satisfies the question constraints better than the proposed answer, set better_than_proposed_answer=true for that alternative and mark entailed=false.
  - Empty alternative_answers is acceptable only when no plausible competing candidate answer in the input evidence satisfies the question constraints better than the proposed answer.
  - Do not mark entailed=true merely because the proposed answer is locally supported by one evidence path; it must beat plausible alternatives under the question constraints.
  - required_candidate_ids lists the minimal sufficient provenance set when entailed=true: include all valid evidence candidate IDs whose text is required to justify the answer, including bridge, entity-linking, comparison, and final answer-support evidence.
  - required_candidate_ids may be narrower than proof-step citations when proof evidence is duplicated, noisy, or not needed to justify the answer, but it must not omit a required reasoning step.
  - Do not include a candidate in required_candidate_ids merely because it was cited by the proof or answer generator; include it only when its text is required to support the answer or the reasoning chain that makes the answer valid.
  - missing_candidate_ids must list evidence candidate IDs that were cited or needed but absent from the proof. If unknown, return an empty list and explain.
  - corrected_answer is diagnostic-only. Include a concise corrected answer only when the evidence clearly supports one; otherwise use null.
  - If exactly one better alternative is fully supported by evidence and satisfies all answer_requirements, corrected_answer may be that alternative answer.
  - Do not mark entailed=true unless required_candidate_ids are sufficient to support the answer and the reasoning chain that makes the answer valid.

  Return strict JSON only.
user_template: "AnswerVerificationContext: {context_json}\nQuery: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1400, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [grounding, verification]
