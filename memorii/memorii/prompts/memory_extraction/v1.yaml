prompt_id: memory_extraction
version: v1
task: Extract source-grounded memory primitives from observations.
description: Extracts entities, factual claims, and actions with evidence quotes for runtime memory evolution.
input_schema:
  type: object
  required: [source_observations]
  additionalProperties: false
  properties:
    source_observations:
      type: array
      items:
        type: object
output_schema:
  type: object
  additionalProperties: false
  required: [entities, claims, actions]
  properties:
    entities:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [entity_id, mention_text, normalized_name, aliases, entity_type, source_id, quote, confidence]
        properties:
          entity_id: {type: string}
          mention_text: {type: string}
          normalized_name: {type: string}
          aliases:
            type: array
            items: {type: string}
          entity_type: {type: string, enum: [project, person, service, task, preference, unknown]}
          source_id: {type: string}
          quote: {type: string}
          confidence: {type: number, minimum: 0.0, maximum: 1.0}
    claims:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [claim_id, subject_entity_id, predicate_id, object_value, object_entity_id, scope_key, qualifier_key, qualifiers, valid_from, valid_to, source_id, quote, confidence]
        properties:
          claim_id: {type: string}
          subject_entity_id: {type: string}
          predicate_id:
            type: string
            enum: [owner, approver, api_owner, status, preference, dependency, action_state, belief, correction, entity_type, semantic_fact]
          object_value: {type: string}
          object_entity_id: {type: [string, 'null']}
          scope_key: {type: string}
          qualifier_key: {type: string}
          qualifiers:
            type: object
            additionalProperties: false
            properties: {}
          valid_from: {type: [string, 'null']}
          valid_to: {type: [string, 'null']}
          source_id: {type: string}
          quote: {type: string}
          confidence: {type: number, minimum: 0.0, maximum: 1.0}
    actions:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [action_id, actor_entity_id, action_type, target_entity_ids, status, dependency_ids, blocking_ids, timestamp, source_id, quote]
        properties:
          action_id: {type: string}
          actor_entity_id: {type: [string, 'null']}
          action_type: {type: string}
          target_entity_ids:
            type: array
            items: {type: string}
          status: {type: string}
          dependency_ids:
            type: array
            items: {type: string}
          blocking_ids:
            type: array
            items: {type: string}
          timestamp: {type: [string, 'null']}
          source_id: {type: string}
          quote: {type: string}
system_template: |-
  You extract runtime memory primitives from source observations.

  Use only the provided observation text. Every entity, claim, and action must include:
  - source_id from the input
  - quote copied verbatim from that source observation

  Extract only facts that the text directly supports. Do not infer durable preferences, owners,
  statuses, dependencies, or actions from vague discussion. If evidence is ambiguous, omit it.

  The source observation includes modality and trigger_mode. Respect them:
  - question, hypothetical, instruction, noise: extract nothing.
  - quoted_or_pasted and third_party_claim: extract entities and evidence-linked semantic facts only when useful, not user beliefs.
  - assertion, correction, tool_result: extract directly supported claims/actions.
  - correction should use predicate_id=correction only for the correction statement itself; also extract the corrected factual claim when explicit.

  Predicate meanings:
  - owner: responsible owner for an entity
  - approver: approver/reviewer role
  - api_owner: owner of an API surface
  - status: current status/state of an entity
  - preference: user preference, preserving scope in scope_key
  - dependency: dependency/support relationship
  - action_state: state of a task/action
  - belief: hypothesis or candidate explanation
  - correction: explicit correction/contradiction
  - entity_type: type/classification of an entity, e.g. project, service, person, task
  - semantic_fact: generic factual relationship when no product-specific predicate fits

  Direct extraction examples:
  - "Atlas billing migration owner = Nadia" -> owner claim with subject Atlas billing migration and object Nadia.
  - "Atlas service is the internal platform service" -> entity_type claim with object service.
  - "Atlas workstream is the Q2 billing migration project" -> entity_type claim with object project.
  - "Marta owns Atlas" -> owner claim where Atlas is the owned subject and Marta is the owner object.
  - "Iris owns Atlas Service" -> owner claim with subject Atlas Service and object Iris; do not make Iris the subject.
  - "Branch A started: re-open old owner notes" -> task entity Branch A, action_state claim with object started, and an action with status started.
  - "Branch A blocked on stale notes" -> task entity Branch A, action_state claim with object blocked, and an action with status blocked.
  - "Branch B in_progress: continue the owner cleanup" -> task entity Branch B, action_state claim with object in_progress, and an action with status in_progress.

  For each entity, emit aliases that are explicitly supported by the source text. Preserve a
  shared ambiguous name (for example, "Atlas") for each distinct typed entity when the text
  uses that name, so deterministic entity resolution can preserve split lineage. Do not invent
  translations, abbreviations, or aliases that do not occur in the observation.

  For explicit task, branch, workflow, or execution-state observations, emit both:
  - an action_state claim so lifecycle/conflict policy can evolve the branch state
  - an action entry so the runtime graph exposes agent-execution pressure as ACTION nodes
  Use stable action status values when possible: started, in_progress, blocked, resumed, abandoned, completed, failed, or succeeded.
  Do not emit actions from hypothetical, noise, question, or pasted/quoted text unless the observation is an explicit tool/verified execution result.

  For each observation, copy the exact source_id from that observation. If there is one source observation, every extracted item must use that source_id.

  Keep entity IDs stable and simple: lowercase, hyphenated, prefixed with ent:.
  Use scope_key from task_id when task scoped; otherwise use global.
  Return strict JSON only.
user_template: |-
  Source observations:
  {source_observations}

  Extract source-grounded entities, claims, and actions. Return strict JSON matching the schema.
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1600, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
tags: [memory_evolution, extraction]
