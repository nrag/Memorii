prompt_id: memory_evolution_decision
version: v1
task: Resolve a memory evolution benchmark checkpoint.
description: Answers or selects the next action from an ordered memory evolution episode.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - selected_memory_ids
    - answer
    - next_action
    - citation_memory_ids
    - supporting_memory_ids
    - context_memory_ids
    - rejected_memory_ids
    - evaluated_belief_ids
    - context_citation_memory_ids
    - active_memory_ids
    - inactive_memory_ids
    - archived_memory_ids
    - belief_scores
    - confidence
    - rationale
    - failure_mode
    - requires_judge_review
  properties:
    selected_memory_ids:
      type: array
      items: {type: string}
    answer: {type: [string, 'null']}
    next_action: {type: [string, 'null']}
    citation_memory_ids:
      type: array
      items: {type: string}
    supporting_memory_ids:
      type: array
      items: {type: string}
    context_memory_ids:
      type: array
      items: {type: string}
    rejected_memory_ids:
      type: array
      items: {type: string}
    evaluated_belief_ids:
      type: array
      items: {type: string}
    context_citation_memory_ids:
      type: array
      items: {type: string}
    active_memory_ids:
      type: array
      items: {type: string}
    inactive_memory_ids:
      type: array
      items: {type: string}
    archived_memory_ids:
      type: array
      items: {type: string}
    belief_scores:
      type: array
      items:
        type: object
        additionalProperties: false
        required: [memory_id, belief]
        properties:
          memory_id: {type: string}
          belief: {type: number, minimum: 0.0, maximum: 1.0}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
    failure_mode: {type: [string, 'null']}
    requires_judge_review: {type: boolean}
system_template: |-
  You resolve benchmark-only memory evolution checkpoints from an ordered event chain.

  Rules:
  - Treat the checkpoint timestamp and query as the decision point.
  - Distinguish current truth from historical truth. Historical queries should retrieve the memory that was true during the requested period.
  - Respect source trust: verified observations and user corrections outrank tool results, and tool results outrank raw transcripts when they conflict.
  - Respect scope. Task scoped preferences should not overwrite global preferences outside that task.
  - Distinguish entity roles and relations. Owner, approver, and API owner are different facts even when entity and vocabulary overlap.
  - For belief chains, degrade downstream beliefs when their supporting premise is falsified.
  - Use role-aware channels precisely:
    - selected_memory_ids is only for final answer/current winner memories.
    - supporting_memory_ids and citation_memory_ids are only for direct answer or next-action support.
    - context_memory_ids and context_citation_memory_ids are for audit context that is useful but not direct support.
    - rejected_memory_ids is for stale, blocked, falsified, lower-trust, wrong-scope, or wrong-entity memories.
  - The context may include visible_memory_cards and evidence_effect_cards derived only from surface event text. Use them as visible structure, not as oracle answers.
  - For competing beliefs, return belief_scores in the evidence-supported order; do not preserve stale priors.
  - For belief-ranking checkpoints, first apply evidence_effect_cards: supported beliefs outrank neutral beliefs; neutral beliefs outrank explicitly weakened beliefs; falsified beliefs rank last.
  - A hypothesis explicitly weakened by new evidence should rank below a neutral alternative unless separate evidence supports it.
  - For belief-ranking checkpoints:
    - Put ranked belief or hypothesis ids and probabilities in belief_scores.
    - Put selected or retrieved belief ids in selected_memory_ids when useful.
    - citation_memory_ids must contain only direct evidence or source memory ids that justify the ranking.
    - Do not put ranked belief/hypothesis ids in citation_memory_ids unless the belief record itself is the direct evidence.
    - active_memory_ids is for current active factual/action memories; do not mark belief candidates active merely because they are ranked.
  - For belief-degradation checkpoints where no beliefs remain confident:
    - Select and cite the falsifying/current evidence.
    - Put degraded belief ids in evaluated_belief_ids, inactive_memory_ids, rejected_memory_ids, or context_memory_ids.
    - Do not use degraded belief ids as direct citation_memory_ids.
  - For execution continuation, suppress abandoned/stale branches and resume the active branch unless the user explicitly reopens a blocked branch.
    - Select/support the active branch or action.
    - Put blocked or abandoned branches in rejected_memory_ids or context_memory_ids.
    - Put user continuation requests or blocked-branch explanations in context_citation_memory_ids rather than citation_memory_ids.
  - citation_memory_ids must directly support the answer or next action.

  Return strict JSON only.
user_template: "MemoryEvolutionDecisionContext: {context_json}\nQueryOrTask: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1200, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
allowed_failure_modes: [temporal_confusion, source_trust_error, scope_leakage, role_confusion, belief_dependency_error, stale_branch_error, rule_limit]
tags: [memory_evolution, benchmark]
