prompt_id: memory_evolution_sim_reconstruction
version: v1
task: Reconstruct a memory evolution checkpoint from surface observations.
description: Benchmark-only latent graph reconstruction using only exposed observations and visible candidate IDs.
input_schema:
  type: object
  required: [context_json, query]
  additionalProperties: false
  properties:
    context_json: {type: object}
    query: {type: string}
output_schema:
  type: object
  additionalProperties: false
  required:
    - operation
    - entity_ids
    - claim_ids
    - relation_ids
    - citation_event_ids
    - belief_ranking_ids
    - selected_entity_ids
    - selected_claim_ids
    - selected_relation_ids
    - supporting_claim_ids
    - supporting_relation_ids
    - supporting_citation_event_ids
    - rejected_entity_ids
    - rejected_claim_ids
    - rejected_relation_ids
    - rejection_citation_event_ids
    - context_entity_ids
    - context_claim_ids
    - context_relation_ids
    - context_citation_event_ids
    - answer
    - next_action
    - uncertain_ids
    - confidence
    - rationale
  properties:
    operation:
      type: string
      enum: [answer, next_action, graph_reconstruction, abstain]
    entity_ids:
      type: array
      items: {type: string}
    claim_ids:
      type: array
      items: {type: string}
    relation_ids:
      type: array
      items: {type: string}
    citation_event_ids:
      type: array
      items: {type: string}
    belief_ranking_ids:
      type: array
      items: {type: string}
    selected_entity_ids:
      type: array
      items: {type: string}
    selected_claim_ids:
      type: array
      items: {type: string}
    selected_relation_ids:
      type: array
      items: {type: string}
    supporting_claim_ids:
      type: array
      items: {type: string}
    supporting_relation_ids:
      type: array
      items: {type: string}
    supporting_citation_event_ids:
      type: array
      items: {type: string}
    rejected_entity_ids:
      type: array
      items: {type: string}
    rejected_claim_ids:
      type: array
      items: {type: string}
    rejected_relation_ids:
      type: array
      items: {type: string}
    rejection_citation_event_ids:
      type: array
      items: {type: string}
    context_entity_ids:
      type: array
      items: {type: string}
    context_claim_ids:
      type: array
      items: {type: string}
    context_relation_ids:
      type: array
      items: {type: string}
    context_citation_event_ids:
      type: array
      items: {type: string}
    answer: {type: [string, 'null']}
    next_action: {type: [string, 'null']}
    uncertain_ids:
      type: array
      items: {type: string}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
system_template: |-
  You reconstruct benchmark-only memory evolution checkpoints from surface observations.

  The hidden latent graph and oracle expectations are not provided. Use only:
  - surface_observations text and metadata
  - visible_events, visible_entities, visible_claims, and visible_relations candidate cards
  - visible_entity_ids, visible_claim_ids, and visible_relation_ids as ID allow-lists
  - the checkpoint query/task, checkpoint type, and difficulty tags

  Rules:
  - Return only IDs that appear in the visible ID lists or citation event IDs from surface_observations.
  - Never invent entity, claim, relation, or event IDs.
  - Use visible candidate cards to understand relation type, endpoints, lifecycle, scope, source trust, and evidence quotes.
  - Use surface_observations.phase and visible_events.phase when present. setup introduces initial facts, interference introduces distractors or weak evidence, evolution introduces corrections/supersession/rekey/scope/action changes, dormancy introduces later unrelated or stale resurfaced evidence, and checkpoint is the delayed question/task.
  - Use metadata.long_horizon.horizon_distance, interference_count, source_event_age_days, and required_retrieval_view as retrieval context only. These fields describe temporal pressure; they are not oracle answers and do not override evidence.
  - Use metadata.checkpoint_contract.selected_entity_role_policy to decide which entity role belongs in selected_entity_ids.
  - Use metadata.checkpoint_contract.answer_required to decide whether answer text is mandatory. If answer_required=false, graph/action channels are authoritative and answer may be null.
  - Use metadata.channel_policy as non-oracle channel guidance. It describes the intended role of selected, supporting, rejected, context, and citation channels without giving expected IDs.
  - Treat selected_*, supporting_*, rejected_*, and context_* as the canonical output. Legacy entity_ids, claim_ids, relation_ids, and citation_event_ids are compatibility views only.
  - Use selected_* only for the final winning current/historical/scoped truth or next-action branch. Do not put stale, superseded, invalidated, lower-trust, wrong-entity, ambiguous, or merely contextual facts in selected_*.
  - For truth checkpoints with selected_entity_role_policy=subject, selected_entity_ids must include the subject_entity_id of each selected_claim_id. In an ownership query such as "who owns X?", the selected claim is the ownership fact and the selected entity is X, not necessarily the owner person named in the answer.
  - In inverse ownership queries such as "what does Y own?", the selected entity is still the owned thing: the subject_entity_id of the selected ownership claim. Put Y, the owner/person object, in context_entity_ids unless the checkpoint explicitly asks to select the object.
  - Example: if a visible claim says subject_entity_id=<owned_service_entity>, predicate=owner, object_entity_id=<owner_person_entity>, and the query asks "What does the owner person own?", selected_claim_ids contains that owner claim, selected_entity_ids contains <owned_service_entity>, and context_entity_ids may contain <owner_person_entity>. Do not put only the owner person in selected_entity_ids.
  - Put answer-object entities, such as an owner person, in context_entity_ids unless selected_entity_role_policy explicitly includes object.
  - For selected_entity_role_policy=active_graph_subjects, selected_entity_ids should contain the subject_entity_id values of active selected_claim_ids. Owner/person object entities, previous owners, sibling services, and lower-ranked hypothesis entities belong in context_* or rejected_* unless their own active subject claim is selected.
  - For selected_entity_role_policy=audit_graph_entities, selected_entity_ids may include broader graph entities required by the audit reconstruction. Use this only when the checkpoint contract explicitly says audit_graph_entities.
  - Use supporting_* only for direct textual evidence needed to support the selected answer or next action. Do not include previous owners, stale facts, wrong-entity facts, pasted notes, ambiguous third-party claims, or noise in supporting_* for current-truth queries.
  - Required entity definition/type claims are definition support, not rejected trap evidence. If a definition/type claim is needed to make the selected graph state well-formed, put it in selected/supporting with its direct citation, or in context only when it is useful audit context but not required. Never put a true definition/type claim for the selected subject in rejected_claim_ids merely because it is not the answer-bearing fact. Reject definition/type claims only when the definition itself is false, stale, contradicted, lower-trust, hidden, or for a wrong entity. Do not use definition-support permission for stale ownership, wrong-entity ownership, lower-trust, or ambiguous claims.
  - Contrastive evidence explains what was ruled out; it is not answer support. If a claim helps distinguish the target from a sibling entity, put it in context_* or rejected_*, not supporting_*, unless it directly states the selected answer.
  - Every selected_claim_id that represents the winning answer, graph fact, or next-action state must also appear in supporting_claim_ids unless the checkpoint explicitly asks for abstention. The supporting_citation_event_ids must include direct evidence for each selected claim.
  - Use rejected_* for stale, superseded, invalidated, lower-trust, wrong-entity, or ambiguous evidence you considered and ruled out.
  - Use context_* only for graph/audit evidence that is useful to explain the situation but is not direct answer support and is not explicitly rejected.
  - Current-truth queries require the latest trusted active fact.
  - Historical queries require the fact true at the requested historical time.
  - In long-horizon cases, late dormancy-phase pasted or transcript text can resurface stale facts. Do not treat resurfaced stale evidence as current truth unless higher-trust evolution-phase evidence supports it.
  - Tool results and verified observations outrank raw transcripts and third-party claims when they conflict.
  - Quoted, pasted, hypothetical, and noisy text is evidence-only unless corroborated by higher-trust evidence.
  - Distinguish roles such as owner, approver, API owner, service owner, and project owner.
  - Distinguish similarly named entities such as a project and service sharing an alias.
  - Include citation_event_ids that directly support the selected answer or next action.
  - Include direct support citations in supporting_citation_event_ids. Do not put noisy, stale pasted, or third-party ambiguity events in supporting_citation_event_ids unless the query explicitly asks for that evidence.
  - Use uncertain_ids when evidence is ambiguous instead of overcommitting.
  - For source-trust conflict checkpoints, include visible contradiction/conflict relation IDs in context_relation_ids or supporting_relation_ids when present. These relation IDs explain why lower-trust or ambiguous claims were rejected; they are audit/conflict context, not the winning ownership claim.
  - For entity split/rekey checkpoints, include visible contradiction/correction relation IDs when present.
  - For belief_ranking checkpoints, set operation=graph_reconstruction, populate belief_ranking_ids in best-to-worst order, put only the winner in selected_claim_ids, and put lower-ranked alternatives in rejected_* or context_*.
  - For execution_continuation checkpoints, set operation=next_action, answer=null, and populate next_action. Also populate selected_claim_ids, selected_entity_ids, supporting_claim_ids, and supporting_citation_event_ids with only the active current state that the next action continues.
  - For execution_continuation, the active action_state claim must appear in both selected_claim_ids and supporting_claim_ids, and supporting_citation_event_ids must include that action_state claim's own evidence event. Owner/project facts may provide context, but they do not replace the active action-state support.
  - For execution_continuation, visible_claims may include action_state_status and continuation_eligibility. Claims with continuation_eligibility=active_candidate are eligible continuation state. Claims with continuation_eligibility=suppressed_candidate are blocked, abandoned, completed, failed, superseded, or otherwise stale; they must never appear in selected_claim_ids, supporting_claim_ids, or supporting_citation_event_ids for the continuation answer.
  - For execution_continuation, put blocked, abandoned, completed, failed, superseded, or wrong-branch action-state claims in rejected_claim_ids or context_claim_ids. Include the rejected branch subject_entity_id in rejected_entity_ids or context_entity_ids.
  - For execution_continuation, user command/checkpoint events and unrelated dormancy events are context only. They are not the active execution state unless a visible active action_state claim supports them.
  - For entity_reconstruction checkpoints, set operation=graph_reconstruction; put active entity/type/role facts in selected/supporting and invalidated or contradicted facts in rejected/context.
  - For current_truth, scoped_truth, source_trust_conflict, and modality_suppression checkpoints, current active evidence belongs in selected/supporting; stale, lower-trust, pasted, or superseded evidence belongs in rejected/context or should be omitted.
  - For historical_truth checkpoints, the historically requested superseded fact may be selected/supporting if it was true at the requested time.
  - For entity_split_repair checkpoints, selected/supporting channels must contain only the current active fact for the entity being answered. Previous owners, superseded facts, and same-name different-entity facts are audit evidence only; put them in rejected_* or context_*, never supporting_*.
  - For entity_split_repair, every non-definition supporting_claim_id must have the same subject_entity_id as the selected target entity. Definition/type supporting claims must define the selected target entity; sibling service/project definitions belong in context_* unless that sibling is the entity being answered.
  - Good entity_split_repair example: for "Who owns the target project, not the similarly named service?", selected/supporting should contain only the target project owner claim and its direct event. The service-owner claim and service entity belong in rejected_* or context_*.
  - Bad entity_split_repair example: answering "Person A owns the target project; Person B owns the similarly named service" while putting the Person B/service-owner claim in supporting_claim_ids. That is wrong because the service-owner claim does not directly support the target project-owner answer.
  - Good inverse ownership example: for "What does the owner person own?", selected/supporting should contain the owner claim, selected_entity_ids should contain the owned subject entity, and the owner person may be context.
  - For entity_split_repair checkpoints, claims about a different same-name entity belong in rejected/context when answering about the target entity. When you reject a wrong-entity claim, include both the rejected claim ID and that claim's subject_entity_id in rejected_* or context_*.
  - For rejected wrong-entity ownership claims, the required rejected/context entity is the rejected claim's subject_entity_id, not its object_entity_id. Example: if a service-owner claim says subject=<similarly_named_service_entity> and object=<service_owner_person>, rejecting that claim requires <similarly_named_service_entity> in rejected_entity_ids or context_entity_ids; the service owner person alone is not enough.
  - For claim_rekey checkpoints, set operation=graph_reconstruction. The selected graph state must include both the current fact and the defining identity/type/rekey fact needed to link the old wording to the current entity. Both claims and their direct citation events must be in selected/supporting channels, not only context. selected_entity_ids should contain the canonical rekeyed subject entity, while owner people, previous owners, and sibling entities should be context or rejected unless they are subjects of selected active claims.
  - For entity_reconstruction and claim_rekey checkpoints, if you select an owner/status/role claim for an entity, also select and support the visible entity_type/definition claim for that same subject when it is available.
  - For modality_suppression questions such as "Should pasted/quoted text make X current?", answering "No" is not enough. selected_* and supporting_* must still contain the current active truth and its direct evidence that defeats the pasted or quoted text.
  - For wrong-role traps, visible wrong-role claims must be rejected or contextualized explicitly, not silently omitted. Never put wrong-role claims in supporting_*.
  - Before returning JSON, run this channel self-check: selected_* and supporting_* contain only the winning truth/action; every selected_claim_id is also in supporting_claim_ids with a direct supporting citation; no selected_claim_id or supporting_claim_id is also in rejected_claim_ids; no blocked, superseded, lower-trust, wrong-entity, wrong-role, or noisy claim is in selected_claim_ids or supporting_claim_ids; supporting_citation_event_ids contain only direct evidence for the winning state.

  Return strict JSON only.
user_template: "MemoryEvolutionSimReconstructionContext: {context_json}\nQueryOrTask: {query}\nReturn strict JSON matching schema."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1400, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
allowed_failure_modes: [temporal_confusion, source_trust_error, scope_leakage, role_confusion, belief_dependency_error, stale_branch_error, invalid_visible_id, rule_limit]
tags: [memory_evolution_sim, benchmark, latent_graph]
