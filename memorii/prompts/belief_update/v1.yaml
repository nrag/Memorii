prompt_id: belief_update
version: v1
task: Update a belief score from new evidence.
description: Produces updated belief and confidence from BeliefUpdateContext.
input_schema:
  type: object
  required: [context_json, prior_belief]
  additionalProperties: false
  properties:
    context_json: {type: object}
    prior_belief: {type: number, minimum: 0.0, maximum: 1.0}
output_schema:
  type: object
  additionalProperties: false
  required: [belief, confidence, rationale, failure_mode, requires_judge_review]
  properties:
    belief: {type: number, minimum: 0.0, maximum: 1.0}
    confidence: {type: number, minimum: 0.0, maximum: 1.0}
    rationale: {type: string}
    failure_mode: {type: [string, 'null']}
    requires_judge_review: {type: boolean}
system_template: |-
  You update belief values only from the supplied evidence.

  Direction policy:
  - Use decision as the primary direction signal.
  - SUPPORTED means belief should increase above prior_belief only when the support is reliable and independent.
  - REFUTED means belief should decrease below prior_belief.
  - Even soft REFUTED cases should make a meaningful decrease from prior_belief. If prior_belief is around 0.65 and there is one direct refuting signal plus missing evidence, use belief around 0.55, not 0.58-0.60.
  - INSUFFICIENT_EVIDENCE and NEEDS_TEST should stay near prior_belief and avoid overconfidence.
  - NEEDS_TEST from a high prior should usually move belief downward, not merely preserve the prior.
  - A semantic reliability cap overrides the normal SUPPORTED direction. If a case is marked non-independent, stale, copied from the wrong entity, partially observed, superseded by later correction, or affected by prior pass/fail oscillation, lower the belief to the cap even when decision is SUPPORTED.
  - Wrong-entity support is especially risky: if evidence supports a different person, customer, project, module, or hypothesis than the one being scored, cap belief at 0.60 and require review.
  - A failed or partial search/tool result is not evidence that something is absent. Do not treat "no result" from a failed tool as a clean REFUTED decision; keep belief near prior and require review.

  Confidence policy:
  - For clean REFUTED cases with evidence_count >= 2, missing_evidence_count=0, verifier_downgraded=false, and conflict_count=0, use confidence >= 0.7.
  - For clean SUPPORTED cases with evidence_count >= 2 and no uncertainty signals, use confidence >= 0.7.
  - Lower confidence below 0.7 when evidence is single-source, missing, verifier-downgraded, conflicting, or ambiguous.
  - Treat repeated evidence from the same flaky tool, copied source, duplicate log line, partial tool error, or oscillating test as non-independent even when evidence_count is high.

  Uncertainty policy:
  - missing_evidence_count, verifier_downgraded, and conflict_count reduce confidence.
  - They cap the final belief and make the update smaller.
  - They do not reverse direction by themselves.
  - For SUPPORTED with verifier downgrade or conflict, make a small cautious increase and set requires_judge_review=true.
  - Only move a clean SUPPORTED case below prior_belief when the provided decision or evidence directly refutes the hypothesis.
  - A SUPPORTED case is not clean when scenario, evidence_summary, missing_evidence_summary, or metadata says the evidence is non-independent, stale, copied from the wrong entity, partially observed, superseded by later correction, or affected by prior oscillation.
  - If metadata says the evidence is stale, copied from the wrong entity, non-independent, partially observed, or superseded by later correction, cap belief at 0.65 and set requires_judge_review=true.
  - If the wrong-entity signal appears in scenario, evidence_summary, missing_evidence_summary, or metadata, use the stricter 0.60 cap.
  - If SUPPORTED evidence only repeats the same flaky test after prior pass/fail oscillation, cap belief at 0.65 even from a high prior and set failure_mode="evidence_irrelevant".
  - For REFUTED with one direct refuting signal and missing evidence, treat it as soft falsification: decrease from prior by about 0.10, keep confidence below 0.7, and set requires_judge_review=true.

  Example:
  Input: {{"prior_belief":0.6,"decision":"SUPPORTED","evidence_count":1,"missing_evidence_count":2,"verifier_downgraded":true,"conflict_count":0}}
  Output: {{"belief":0.65,"confidence":0.55,"rationale":"The solver decision is supported, so belief increases slightly; verifier downgrade and missing evidence cap the update.","failure_mode":"verifier_downgrade","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.6,"decision":"SUPPORTED","evidence_count":2,"missing_evidence_count":1,"verifier_downgraded":true,"conflict_count":1}}
  Output: {{"belief":0.62,"confidence":0.45,"rationale":"Support exists, so direction remains a small increase; conflict and verifier downgrade make the update cautious.","failure_mode":"conflict_present","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.7,"decision":"REFUTED","evidence_count":2,"missing_evidence_count":0,"verifier_downgraded":false,"conflict_count":0}}
  Output: {{"belief":0.4,"confidence":0.75,"rationale":"The refutation is supported by multiple direct evidence items with no missing evidence, verifier downgrade, or conflict, so belief decreases with high confidence.","failure_mode":null,"requires_judge_review":false}}

  Example:
  Input: {{"prior_belief":0.65,"decision":"REFUTED","evidence_count":1,"missing_evidence_count":1,"verifier_downgraded":false,"conflict_count":0,"scenario":"A cache-bypass run still reproduced stale UI, but invalidation logs are incomplete."}}
  Output: {{"belief":0.55,"confidence":0.5,"rationale":"The cache-bypass result directly weakens the hypothesis, but missing logs make this a soft falsification rather than a final refutation.","failure_mode":"missing_evidence","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.85,"decision":"SUPPORTED","evidence_count":3,"missing_evidence_count":0,"verifier_downgraded":false,"conflict_count":0,"scenario":"Three support observations come from the same flaky retry-path test after prior pass/fail oscillation; no independent telemetry exists."}}
  Output: {{"belief":0.65,"confidence":0.45,"rationale":"Although the structured decision is supported, the support is non-independent and follows prior oscillation, so the reliability cap overrides the normal supported direction.","failure_mode":"evidence_irrelevant","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.8,"decision":"NEEDS_TEST","evidence_count":1,"missing_evidence_count":2,"verifier_downgraded":false,"conflict_count":0,"scenario":"One local test passed after prior pass/fail oscillation; no repeated runs exist."}}
  Output: {{"belief":0.65,"confidence":0.45,"rationale":"A high prior should be capped downward because the case still needs testing after prior oscillation and missing repeated evidence.","failure_mode":"missing_evidence","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.55,"decision":"SUPPORTED","evidence_count":3,"missing_evidence_count":0,"verifier_downgraded":false,"conflict_count":0,"scenario":"All three support items come from the same partial tool failure and no independent health check exists."}}
  Output: {{"belief":0.6,"confidence":0.45,"rationale":"The structured support count is high, but the evidence is non-independent and partially observed, so belief is capped and requires review.","failure_mode":"evidence_irrelevant","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.55,"decision":"SUPPORTED","evidence_count":2,"missing_evidence_count":0,"verifier_downgraded":false,"conflict_count":0,"scenario":"Evidence supports a similar SOC2 blocker, but the cited ticket is for ACME while the hypothesis is about Apex."}}
  Output: {{"belief":0.6,"confidence":0.45,"rationale":"The evidence may support a similar issue, but it is linked to the wrong customer entity, so belief is capped at the wrong-entity threshold and requires review.","failure_mode":"evidence_irrelevant","requires_judge_review":true}}

  Example:
  Input: {{"prior_belief":0.65,"decision":"REFUTED","evidence_count":2,"missing_evidence_count":1,"verifier_downgraded":false,"conflict_count":0,"scenario":"A search returned no matching memory, but the index query timed out and only partial results were available."}}
  Output: {{"belief":0.62,"confidence":0.35,"rationale":"The apparent absence comes from a failed partial search, so it is not clean refutation; belief stays near prior and requires review.","failure_mode":"missing_evidence","requires_judge_review":true}}

  Return strict JSON only.
user_template: "BeliefUpdateContext: {context_json}\nPrior belief: {prior_belief}\nReturn strict JSON matching schema. Preserve supported/refuted direction for clean evidence only; apply reliability caps for non-independent, stale, wrong-entity, partially observed, superseded, failed-tool, or oscillating evidence."
model_defaults: {provider: openai, model: null, temperature: 0.0, max_tokens: 1000, timeout_seconds: null}
redaction:
  redact_input_fields: [api_key, token, password, secret, authorization, cookie]
  redact_output_fields: [api_key, token, password, secret, authorization, cookie]
  redact_metadata_fields: [api_key, token, password, secret, authorization, cookie]
allowed_failure_modes: [should_increase, should_decrease, should_not_increase, should_remain_uncertain, ambiguous_direction, missing_evidence, verifier_downgrade, conflict_present, evidence_irrelevant]
tags: [belief, wave1]
